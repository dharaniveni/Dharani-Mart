<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart | DharniMart</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar market-topbar">
    <a class="brand" href="/home">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <path d="M3 6h18"></path>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
      </span>
      <span class="brand-name">DharniMart</span>
    </a>
    <nav class="market-nav">
      <button type="button" class="nav-btn" id="homeNavBtn">Home</button>
      <button type="button" class="nav-btn active" id="cartNavBtn">
        <span class="nav-icon">&#128722;</span> Cart
        <span class="cart-count" id="cartCount">0</span>
      </button>
      <button type="button" class="nav-btn" id="myOrdersNavBtn">My Orders</button>
      <button type="button" class="nav-btn" id="logoutBtn">Logout</button>
    </nav>
  </header>

  <main class="cart-page">
    <div class="cart-head">
      <h1>Your Cart</h1>
      <span class="cart-count-label" id="cartCountLabel">0 items</span>
    </div>
    <div id="cartBody">
      <div class="cart-empty">
        <p>Your cart is empty.</p>
        <button type="button" class="btn btn-primary" data-browse>Browse Products</button>
      </div>
    </div>
  </main>

  <footer class="footer-note">DharniMart &copy; 2026 &middot; ReuseHub</footer>

  <script src="/js/cart.js"></script>
</body>
</html>
